name: SentinelAI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinelpassword
          POSTGRES_DB: sentinel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e backend/

      - name: Code Quality & Lint (Ruff)
        run: |
          ruff check backend/app

      - name: Run Full Security & Unit Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinelpassword@localhost:5432/sentinel_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests -v

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build & Typecheck Frontend
        run: |
          cd frontend
          npm run build

  build-and-deploy:
    name: Container Build & ECS Deploy
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        run: |
          docker build -t sentinel-backend:latest ./backend

      - name: Build Frontend Container
        run: |
          docker build -t sentinel-frontend:latest ./frontend

      - name: Deployment Notification
        run: |
          echo "SentinelAI CI/CD verification passed successfully. Images ready for Amazon ECR and ECS Fargate release."

